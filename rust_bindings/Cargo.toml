[package]
name = "_lowlevel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for slimg-core image processing library using pyo3"

[lib]
name = "_lowlevel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
slimg-core = "0.5"
