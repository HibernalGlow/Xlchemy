name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: xlchemy-wails
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct

jobs:
  # 这条线是 Wails/Go 版：只有仓库里带 Go 工程时才构建。
  # 主干（Python + PySide6 版）没有 go.mod，之前打 tag 会让本 workflow
  # 直接红在「Install frontend dependencies」，所以先探一次再决定跑不跑。
  gate:
    name: Check Wails app present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-go-app: ${{ steps.probe.outputs.has-go-app }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f go.mod ] && [ -f frontend/package.json ] && [ -f build/windows/nsis/project.nsi ]; then
            echo "has-go-app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-go-app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库里没有 Wails 工程（go.mod / frontend / NSIS 脚本），跳过 Wails 构建"
          fi

  build-windows:
    name: Build Windows
    needs: gate
    if: needs.gate.outputs.has-go-app == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ─── Toolchain ────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # ─── Frontend ─────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      # ─── Extract tools ────────────────────────────────────
      - name: Extract bin/win tools
        shell: powershell
        run: |
          $zipPath = "${{ github.workspace }}\bin\win.zip"
          $destPath = "${{ github.workspace }}\bin\win"
          if (Test-Path $zipPath) {
            Expand-Archive -Path $zipPath -DestinationPath $destPath -Force
            Write-Host "Extracted bin/win.zip"
            Get-ChildItem $destPath -Directory | Select-Object Name
          } else {
            Write-Error "bin/win.zip not found"
            exit 1
          }

      # ─── Windows resources (.syso) ────────────────────────
      - name: Generate syso
        working-directory: build
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      # ─── Go binary ────────────────────────────────────────
      - name: Build Go binary (production)
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/${{ env.APP_NAME }}.exe .

      # ─── NSIS installer ───────────────────────────────────
      - name: Generate WebView2 bootstrapper
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis

      - name: Build NSIS installer
        working-directory: build/windows/nsis
        run: makensis -DARG_WAILS_AMD64_BINARY=../../../bin/${{ env.APP_NAME }}.exe project.nsi

      # ─── Portable zip ─────────────────────────────────────
      - name: Package portable zip
        shell: powershell
        run: |
          $releaseDir = "release/Xlchemy-Wails-${{ github.ref_name }}-portable"
          New-Item -ItemType Directory -Force -Path $releaseDir
          Copy-Item "bin/${{ env.APP_NAME }}.exe" $releaseDir
          Copy-Item -Recurse "bin/win" "$releaseDir/bin/win"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "release/Xlchemy-Wails-${{ github.ref_name }}-portable-win-x64.zip"

      # ─── Collect & Release ────────────────────────────────
      - name: Collect release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "bin/${{ env.APP_NAME }}-amd64-installer.exe" "dist/Xlchemy-Wails-${{ github.ref_name }}-setup-win-x64.exe"
          Copy-Item "release/Xlchemy-Wails-${{ github.ref_name }}-portable-win-x64.zip" "dist/"
          Get-ChildItem dist/ | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Xlchemy-Wails-${{ github.ref_name }}-setup-win-x64.exe
            dist/Xlchemy-Wails-${{ github.ref_name }}-portable-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
