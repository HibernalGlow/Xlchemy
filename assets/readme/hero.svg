<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Xlchemy — 批量现代图片格式转换器</title>
  <desc id="hero-desc">左侧为项目名与一句话说明，以及 JPEG XL、AVIF、WebP、JPEG、PNG 五个输出格式标签；右侧用应用界面的分组卡片样式展示文件在转换后体积变小的示意条形。</desc>

  <defs>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="26" fill="#141414" stroke="#404040" stroke-width="1.5"/>

  <!-- title block -->
  <g id="title-block" class="ui" transform="translate(56 54)">
    <text class="mono" x="0" y="16" font-size="18" letter-spacing="2.4" fill="#9A9A9A">BATCH IMAGE CONVERTER · 批量图片压缩</text>
    <text x="0" y="86" font-size="68" font-weight="600" fill="#E9E9E9">Xlchemy</text>
    <rect x="2" y="104" width="132" height="4" rx="2" fill="#E12885"/>
    <text x="0" y="146" font-size="24" fill="#E9E9E9">拖进来，选格式，批量压成现代格式。</text>
    <text x="0" y="180" font-size="19" fill="#9A9A9A">JPEG XL · AVIF · WebP · JPEG · PNG, in one window.</text>

    <g id="format-chips" transform="translate(0 210)">
      <g>
        <rect x="0" y="0" width="96" height="40" rx="9" fill="#1B1B1B" stroke="#39C5BB" stroke-width="1.5"/>
        <text class="mono" x="48" y="26" font-size="19" text-anchor="middle" fill="#39C5BB">JPEG XL</text>
      </g>
      <g transform="translate(106 0)">
        <rect x="0" y="0" width="76" height="40" rx="9" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
        <text class="mono" x="38" y="26" font-size="19" text-anchor="middle" fill="#E9E9E9">AVIF</text>
      </g>
      <g transform="translate(192 0)">
        <rect x="0" y="0" width="76" height="40" rx="9" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
        <text class="mono" x="38" y="26" font-size="19" text-anchor="middle" fill="#E9E9E9">WebP</text>
      </g>
      <g transform="translate(278 0)">
        <rect x="0" y="0" width="72" height="40" rx="9" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
        <text class="mono" x="36" y="26" font-size="19" text-anchor="middle" fill="#E9E9E9">JPEG</text>
      </g>
      <g transform="translate(360 0)">
        <rect x="0" y="0" width="66" height="40" rx="9" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
        <text class="mono" x="33" y="26" font-size="19" text-anchor="middle" fill="#E9E9E9">PNG</text>
      </g>
    </g>
  </g>

  <!-- proof: in-app group box with shrinking size bars -->
  <g id="proof-card" class="ui" transform="translate(676 48)">
    <rect x="0" y="0" width="468" height="316" rx="14" fill="#1B1B1B" stroke="#404040" stroke-width="1.5"/>
    <rect x="18" y="-11" width="92" height="22" fill="#141414"/>
    <text x="26" y="6" font-size="19" fill="#39C5BB">Convert</text>

    <g id="row-1" transform="translate(28 40)">
      <text class="mono" x="0" y="14" font-size="18" fill="#E9E9E9">IMG_2841.jpg</text>
      <text class="mono" x="412" y="14" font-size="18" text-anchor="end" fill="#9A9A9A">4.8 MB</text>
      <rect x="0" y="24" width="412" height="9" rx="4.5" fill="#404040"/>
      <text class="mono" x="0" y="58" font-size="18" fill="#E9E9E9">IMG_2841.jxl</text>
      <text class="mono" x="412" y="58" font-size="18" text-anchor="end" fill="#39C5BB">1.9 MB</text>
      <rect x="0" y="68" width="163" height="9" rx="4.5" fill="#39C5BB"/>
    </g>

    <g id="row-2" transform="translate(28 132)">
      <text class="mono" x="0" y="14" font-size="18" fill="#E9E9E9">scan-014.png</text>
      <text class="mono" x="412" y="14" font-size="18" text-anchor="end" fill="#9A9A9A">12.4 MB</text>
      <rect x="0" y="24" width="412" height="9" rx="4.5" fill="#404040"/>
      <text class="mono" x="0" y="58" font-size="18" fill="#E9E9E9">scan-014.avif</text>
      <text class="mono" x="412" y="58" font-size="18" text-anchor="end" fill="#39C5BB">2.1 MB</text>
      <rect x="0" y="68" width="70" height="9" rx="4.5" fill="#39C5BB"/>
    </g>

    <g id="queue" transform="translate(28 232)">
      <rect x="0" y="0" width="412" height="10" rx="5" fill="#404040"/>
      <rect x="0" y="0" width="286" height="10" rx="5" fill="#E12885"/>
      <text class="mono" x="0" y="38" font-size="18" fill="#9A9A9A">并行编码 · parallel encoding</text>
      <text class="mono" x="412" y="38" font-size="18" text-anchor="end" fill="#9A9A9A">68%</text>
    </g>

    <text class="ui" x="28" y="294" font-size="16" fill="#6E6E6E">条长为示意，非实测基准 · schematic</text>
  </g>

  <g id="footer-meta" class="mono" transform="translate(56 382)">
    <text x="0" y="0" font-size="17" fill="#9A9A9A">fork of XL Converter · Windows / Linux / macOS · GPL-3.0</text>
  </g>
</svg>
