[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xlchemy-rust"
version = "1.2.5"
requires-python = ">=3.9"
description = "High-performance image processing bindings for Xlchemy using Rust"
license = { text = "MIT" }
keywords = ["image", "optimization", "compression", "webp", "avif", "jpeg", "png", "jxl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "maturin>=1.13.3",
    "pillow>=11.3.0",
    "pyside6==6.8.2.1",
    "send2trash==1.8.3",
]

[tool.maturin]
manifest-path = "rust_bindings/Cargo.toml"
bindings = "pyo3"
python-source = "."
module-name = "xlchemy_rust._lowlevel"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "requests>=2.32.5",
    "pytest>=8.4.2",
]
