[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xlchemy-rust"
version = "0.1.0"
requires-python = ">=3.9"
description = "High-performance image processing bindings for Xlchemy using Rust"
license = { text = "MIT" }
keywords = ["image", "optimization", "compression", "webp", "avif", "jpeg", "png", "jxl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[tool.maturin]
manifest-path = "rust_bindings/Cargo.toml"
bindings = "pyo3"
python-source = "."
module-name = "xlchemy_rust._lowlevel"
